x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      KOHAKU_CHANNELS: ${KOHAKU_CHANNELS:-whatsapp}
  volumes:
    - ~/.kohaku:/home/kohaku/.kohaku
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the kohaku user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  kohaku-gateway:
    container_name: kohaku-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  kohaku-api:
    container_name: kohaku-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/kohaku/.kohaku/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  kohaku-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
