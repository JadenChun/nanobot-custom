<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Kohaku</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar-skeleton" aria-hidden="true">
        <div class="sidebar-brand">
          <div class="mark small">K</div>
          <span class="skel-icon"></span>
        </div>
        <div class="sidebar-actions">
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar w-55"></span></div>
          <div class="skel-row"><span class="skel-dot"></span><span class="skel-bar w-42"></span></div>
        </div>
        <div class="sidebar-list">
          <div class="skel-section"></div>
          <div class="skel-item"><span class="skel-bar w-78"></span></div>
          <div class="skel-item"><span class="skel-bar w-64"></span></div>
          <div class="skel-item"><span class="skel-bar w-85"></span></div>
          <div class="skel-item"><span class="skel-bar w-58"></span></div>
          <div class="skel-item"><span class="skel-bar w-70"></span></div>
        </div>
        <div class="sidebar-footer">
          <span class="skel-avatar"></span>
          <span class="skel-bar w-48"></span>
        </div>
      </aside>

      <main class="chat-stage">
        <header class="thread-header-skeleton" aria-hidden="true">
          <span class="skel-bar w-28"></span>
          <div class="header-right">
            <span class="skel-circle"></span>
            <span class="skel-circle"></span>
          </div>
        </header>

        <section id="splash" class="splash" aria-live="polite">
          <div class="splash-center">
            <div class="spinner-pill">
              <span id="spinner" class="spinner" aria-hidden="true"></span>
              <p id="splash-status">Starting Kohaku…</p>
            </div>
          </div>

          <div class="composer-dock-skeleton" aria-hidden="true">
            <div class="composer-box-skeleton">
              <span class="skel-bar w-36"></span>
              <div class="composer-toolbar-skeleton">
                <div class="composer-left-pills">
                  <span class="skel-pill w-24"></span>
                  <span class="skel-pill w-20"></span>
                </div>
                <span class="skel-send"></span>
              </div>
            </div>
          </div>
        </section>

        <div id="fallback-wrap" class="fallback-wrap">
          <section id="fallback" class="fallback" aria-live="polite" hidden>
            <div class="fallback-header">
              <div class="mark small" aria-hidden="true">K</div>
              <div>
                <strong id="state">Could not start Kohaku</strong>
                <p id="detail" class="detail"></p>
              </div>
            </div>

            <div class="actions">
              <button id="retry" type="button" hidden>Retry</button>
              <button id="open-chat" type="button" hidden>Open chat</button>
              <button id="toggle-advanced" class="secondary" type="button">Connection settings</button>
              <button id="quit" class="secondary" type="button">Quit</button>
            </div>

            <section id="selection" class="advanced" aria-labelledby="selection-title" hidden>
              <h2 id="selection-title">Connection settings</h2>
              <p id="selection-hint" class="hint">
                Kohaku uses ~/.nanobot/config.json by default. Override paths only if you use a custom installation.
              </p>
              <label for="config">Config file</label>
              <div class="field-row">
                <input id="config" type="text" autocomplete="off" spellcheck="false" placeholder="Absolute path to config.json" />
                <button class="secondary" data-pick="config" type="button">Browse</button>
              </div>
              <label for="python">Python interpreter</label>
              <div class="field-row">
                <input id="python" type="text" autocomplete="off" spellcheck="false" placeholder="Absolute path to bin/python" />
                <button class="secondary" data-pick="python" type="button">Browse</button>
              </div>
              <label for="workspace">Workspace override <span>(optional)</span></label>
              <div class="field-row">
                <input id="workspace" type="text" autocomplete="off" spellcheck="false" placeholder="Use the config's default workspace" />
                <button class="secondary" data-pick="workspace" type="button">Browse</button>
              </div>
              <div class="actions">
                <button id="connect" type="button">Save &amp; start</button>
                <button id="change" class="secondary" type="button" hidden>Change selection</button>
              </div>
            </section>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
