[package]
name = "kohaku-desktop"
version = "0.3.0"
description = "Thin native desktop shell for an installed Kohaku backend"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-opener = "=2.7.2"
url = "=2.5.7"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "=0.18.4"
tauri-plugin-single-instance = "=2.5.4"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.5"
