name: Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, staging, "codex/upstream-migration", "codex/harness-migration-candidate"]
    paths-ignore:
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md
  pull_request:
    branches: [main, staging, "codex/upstream-migration"]
    paths-ignore:
      - .agent/**
      - .github/ISSUE_TEMPLATE/**
      - AGENTS.md
      - CLAUDE.md
      - COMMUNICATION.md
      - CONTRIBUTING.md
      - README.md
      - SECURITY.md
      - webui/README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      python_required: ${{ steps.paths.outputs.python_required }}
      webui_required: ${{ steps.paths.outputs.webui_required }}
      tui_required: ${{ steps.paths.outputs.tui_required }}
      docker_required: ${{ steps.paths.outputs.docker_required }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Python-relevant changes
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            diff_range="${BASE_SHA}...${HEAD_SHA}"
          else
            diff_range="${BASE_SHA}..${HEAD_SHA}"
          fi

          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            changed_files="$(git diff --name-only --no-renames "$diff_range")" &&
            [[ -n "$changed_files" ]]; then
            printf '%s\n' "$changed_files" | bash scripts/check_ci_paths.sh >> "$GITHUB_OUTPUT"
          else
            echo "python_required=true" >> "$GITHUB_OUTPUT"
            echo "webui_required=true" >> "$GITHUB_OUTPUT"
            echo "tui_required=true" >> "$GITHUB_OUTPUT"
            echo "docker_required=true" >> "$GITHUB_OUTPUT"
          fi

  webui_bundle:
    name: WebUI bundle for Python
    needs: changes
    if: needs.changes.outputs.python_required == 'true' || needs.changes.outputs.webui_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Build WebUI bundle
        working-directory: webui
        run: bun run build

      - name: Verify bundle output
        run: test -f kohaku/web/dist/index.html

      - name: Verify fresh WebUI bundle for release
        env:
          KOHAKU_REQUIRE_FRESH_WEBUI: "1"
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root))
          from kohaku.webui.build import (
              describe_webui_bundle_status,
              inspect_webui_bundle,
              require_fresh_webui_bundle,
          )

          status = inspect_webui_bundle(
              source_dir=root / "webui",
              dist_dir=root / "kohaku" / "web" / "dist",
          )
          require_fresh_webui_bundle(status)
          print(describe_webui_bundle_status(status))
          PY

      - name: Upload WebUI bundle
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: kohaku/web/dist
          if-no-files-found: error

  test:
    name: Python (latest, 3.14 + coverage)
    needs: [changes, webui_bundle]
    if: needs.changes.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Run the CLI tests serially to preserve terminal-width rendering.
      PYTEST_ARGS: "-n auto --dist loadfile --ignore=tests/cli/test_commands.py"

    steps:
      - uses: actions/checkout@v4

      - name: Download WebUI bundle
        uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: kohaku/web/dist

      - name: Verify WebUI bundle
        shell: bash
        run: test -f kohaku/web/dist/index.html

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install system dependencies (Linux)
        run: sudo apt-get update && sudo apt-get install -y libolm-dev build-essential

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install channel dependencies
        run: uv run --no-sync python -m scripts.install_channel_dependencies --all-channels

      - name: Verify dependency consistency
        run: uv pip check

      - name: Record verification identity
        id: verification_setup
        shell: bash
        env:
          MATRIX_NAME: latest, 3.14 + coverage
        run: |
          mkdir -p artifacts
          uv run --no-sync python - <<'PY' > artifacts/environment.txt
          import hashlib
          import os
          import platform
          import subprocess
          from pathlib import Path

          root = Path.cwd()

          def digest_tree(path: Path) -> str:
              digest = hashlib.sha256()
              for item in sorted(path.rglob("*")):
                  if item.is_file():
                      digest.update(item.relative_to(root).as_posix().encode())
                      digest.update(item.read_bytes())
              return digest.hexdigest()

          def command(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          print(f"source_sha={os.environ.get('GITHUB_SHA', command('git', 'rev-parse', 'HEAD'))}")
          print(f"matrix_name={os.environ.get('MATRIX_NAME', '')}")
          print(f"python={platform.python_version()}")
          print(f"uv={command('uv', '--version')}")
          print(f"uv_lock_sha256={hashlib.sha256((root / 'uv.lock').read_bytes()).hexdigest()}")
          print(f"webui_bundle_sha256={digest_tree(root / 'kohaku/web/dist')}")
          print(f"pytest_args={os.environ.get('PYTEST_ARGS', '')}")
          PY
          uv pip freeze > artifacts/pip-freeze.txt

      # Channel requirements live in manifests rather than uv.lock. Avoid a
      # later uv run sync pruning the packages installed by the previous step.
      - name: Lint with ruff
        run: uv run --no-sync ruff check kohaku tests conftest.py

      - name: Prepare the frozen type baseline
        if: ${{ !cancelled() && steps.verification_setup.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          # Relocate the frozen package paths after the source rename.
          # Keep the original report, diagnostic signatures, and checker rules.
          destination = Path(os.environ["RUNNER_TEMP"]) / "a3-0-baseline"
          destination.mkdir()
          config = Path(".github/baselines/a3-0/pyproject.toml").read_text()
          source_scope = 'include = ["nanobot"]'
          if (
              tomllib.loads(config)["tool"]["basedpyright"]["include"] != ["nanobot"]
              or config.count(source_scope) != 1
          ):
              raise SystemExit("Unexpected frozen checker source scope")
          (destination / "pyproject.toml").write_text(
              config.replace(source_scope, 'include = ["kohaku"]', 1)
          )

          report = json.loads(Path(".github/baselines/a3-0-basedpyright.json").read_text())
          original_source = Path("/tmp/a3-0-baseline/nanobot")
          for diagnostic in report["generalDiagnostics"]:
              relative = Path(diagnostic["file"]).relative_to(original_source)
              diagnostic["file"] = str(destination / "kohaku" / relative)
          (destination / "basedpyright.json").write_text(json.dumps(report))
          PY

      - name: Type check with BasedPyright (strict)
        if: ${{ !cancelled() && steps.verification_setup.outcome == 'success' }}
        run: >-
          uv run --no-sync basedpyright --outputjson
          > basedpyright.json

      - name: Compare strict diagnostics with the frozen baseline
        if: ${{ !cancelled() && steps.verification_setup.outcome == 'success' }}
        run: >-
          uv run --no-sync python scripts/check_type_regressions.py
          "$RUNNER_TEMP/a3-0-baseline/basedpyright.json" basedpyright.json
          --baseline-root "$RUNNER_TEMP/a3-0-baseline"
          --current-root "${{ github.workspace }}"

      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.verification_setup.outcome == 'success' }}
        env:
          COLUMNS: "120"
          LINES: "40"
        run: >-
          uv run --no-sync python -m pytest
          ${{ env.PYTEST_ARGS }}
          --cov=kohaku --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0
          --junitxml=artifacts/pytest.xml

      - name: Run serial CLI command tests with coverage
        if: ${{ !cancelled() && steps.verification_setup.outcome == 'success' }}
        env:
          COLUMNS: "120"
          LINES: "40"
        run: >-
          uv run --no-sync python -m pytest
          tests/cli/test_commands.py
          --cov=kohaku --cov-append --cov-report=term-missing:skip-covered
          --durations=25 --durations-min=1.0
          --junitxml=artifacts/cli.xml

      - name: Upload Python verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-verification-latest, 3.14 + coverage
          path: |
            basedpyright.json
            artifacts/
          if-no-files-found: warn

  macos:
    name: macOS executor (Seatbelt)
    needs: changes
    if: needs.changes.outputs.python_required == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # A hosted runner is disposable, so tests that signal real processes may run.
      KOHAKU_DARWIN_DESTRUCTIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run macOS executor tests
        run: >-
          uv run --no-sync python -m pytest -q
          tests/darwin
          tests/agent/test_executor_capabilities.py
          tests/agent/test_executor_capability_parity.py
          tests/security/test_darwin_proc.py

  webui:
    needs: changes
    if: needs.changes.outputs.webui_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Verify npm lockfile
        working-directory: webui
        run: npm ci --ignore-scripts --dry-run

      - name: Install WebUI dependencies
        working-directory: webui
        run: bun install --frozen-lockfile

      - name: Lint WebUI
        working-directory: webui
        run: bun run lint

      - name: Test WebUI
        working-directory: webui
        run: bun run test:coverage

      - name: Build WebUI
        working-directory: webui
        run: bun run build

  tui:
    needs: changes
    if: needs.changes.outputs.tui_required == 'true'
    name: Terminal UI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install TUI dependencies
        working-directory: tui
        run: bun install --frozen-lockfile

      - name: Check TUI
        working-directory: tui
        run: bun run check

      - name: Test TUI
        working-directory: tui
        run: bun run test

      - name: Test TUI in a real pseudo-terminal
        working-directory: tui
        run: python3 scripts/pty_smoke.py

      - name: Build TUI
        working-directory: tui
        run: bun run build

      - name: Verify licensed Linux release archive
        working-directory: tui
        run: |
          bun scripts/release-notices.ts linux-x64
          python3 scripts/package-release.py linux-x64

  docker:
    needs: changes
    if: needs.changes.outputs.docker_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build image with default channel dependencies
        run: docker build -t kohaku:test .

      - name: Verify Docker Compose startup and privilege boundary
        env:
          HOME: ${{ runner.temp }}
        run: |
          docker compose run --rm --no-deps --build -T kohaku-cli status
          docker compose run --rm --no-deps -T --entrypoint sh kohaku-cli -s <<'OUTER'
          set -eu
          field() {
            awk -v key="$1:" '$1 == key { print $2 }' /proc/self/status
          }
          test "$(id -u)" = "0"
          test "$(field NoNewPrivs)" = "1"
          setpriv --reuid=kohaku --regid=kohaku --init-groups sh -s <<'INNER'
          set -eu
          field() {
            awk -v key="$1:" '$1 == key { print $2 }' /proc/self/status
          }
          test "$(id -u)" = "1000"
          test "$(field NoNewPrivs)" = "1"
          for capability_set in CapInh CapPrm CapEff CapAmb; do
            test "$(field "$capability_set")" = "0000000000000000"
          done
          INNER
          OUTER
          docker compose -f docker-compose.yml -f docker-compose.bwrap.yml --profile cli \
            config --format json > "${RUNNER_TEMP}/bwrap-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path(os.environ["RUNNER_TEMP"], "bwrap-compose.json").read_text())
          for service_name in ("kohaku-gateway", "kohaku-api", "kohaku-cli"):
              service = config["services"][service_name]
              assert {"CHOWN", "SETGID", "SETUID", "SYS_ADMIN"} <= set(service["cap_add"])
              assert "no-new-privileges:true" in service["security_opt"]
          PY

      - name: Verify default WhatsApp dependencies
        run: docker run --rm --entrypoint python kohaku:test -c "import neonize, segno"

      - name: Verify runtime dependency permissions
        run: >-
          docker run --rm --user 1000:1000 --entrypoint sh kohaku:test -c
          'test -w /app/.venv && test ! -w /app && test ! -w /app/kohaku &&
          python -m scripts.install_channel_dependencies discord && python -c "import discord"'
